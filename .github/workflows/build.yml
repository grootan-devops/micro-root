name: Build · Manual Image Verification

on:
  workflow_dispatch:

run-name: "CI · ${{ github.event_name }} · ${{ github.sha }}"

concurrency:
  group: build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init:
    uses: grootan-devops/github-ci-library/.github/workflows/init.yml@1.5.0
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      ignore-docker: "false"
      ignore-chart: "true"

  trivy-cache:
    uses: grootan-devops/github-ci-library/.github/workflows/trivy-cache.yml@1.5.0
    secrets: inherit
    permissions:
      contents: read
      actions: write
    with:
      enable-java-db: false

  image:
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/buildah.yml@1.5.0
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      image-tag: ${{ needs.init.outputs.image-push-tag }}
      image-repository: ${{ needs.init.outputs.image-push-repository }}
      base-image-repo: registry.access.redhat.com/ubi9/ubi-micro
      # renovate: datasource=docker depName=registry.access.redhat.com/ubi9/ubi-micro versioning=redhat
      base-image-tag: "9.8-1784702951"
      install-packages: "bash coreutils-single basesystem"
      required-packages: "bash coreutils-single basesystem"
      container-entrypoint: "/usr/bin/dumb-init --"
      container-cmd: "bash"
      test: true
      test-script: ci_image_test.sh
      test-path: "."
      test-shell: bash

  image-scan:
    needs: [image, trivy-cache]
    uses: grootan-devops/github-ci-library/.github/workflows/scan.yml@1.5.0
    secrets: inherit
    permissions:
      contents: read
      checks: write
    with:
      scan-type: image
      image-ref: ${{ needs.image.outputs.image-ref-digest }}
